
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f4f4f3;
  color:#1d1d1f;
}
.screen{display:none;padding:1.8rem 1rem;max-width:1380px;margin:0 auto}
.screen.active{display:block}
.study-card{background:#f4f4f3;border:1px solid #d8d8d8;border-radius:22px;padding:2.4rem 3rem}
.study-title{font-size:12px;text-align:center;color:#424242;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #d1d1d1}
h1{font-size:44px;font-weight:600;color:#161719;line-height:1.15;margin-bottom:1.2rem}
h2{font-size:32px;font-weight:600;color:#1f1f20;line-height:1.2;margin-bottom:.9rem}
p{font-size:14px;color:#3f3f41;line-height:1.7;margin-bottom:.95rem}
p:last-child{margin-bottom:0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;font-size:13px;font-weight:500;border:1px solid #bdbdbd;border-radius:18px;background:#f4f4f3;color:#1f2022;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#ededeb;border-color:#adadad}
.btn:active{transform:scale(.98)}
.btn-primary{background:#f4f4f3;color:#1f2022;border-color:#bdbdbd}
.btn-primary:hover{background:#ebebe9}
.btn-end{color:#1f2022;border-color:#bdbdbd;font-size:13px}
.btn-end:hover{background:#ebebe9}
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.8rem}
.info-box{background:#c7d6ea;border-radius:18px;padding:1rem 1.3rem;margin-bottom:1.2rem}
.info-box p{color:#2d5fa8;margin:0;font-size:14px;line-height:1.5}
.success-box{background:#d5e2cc;border:1px solid #3f7b38;border-radius:16px;padding:.85rem 1.1rem;margin-bottom:1rem}
.success-box p{color:#245723;margin:0;font-size:13px}
.warn-box{background:#f2e8c6;border-radius:16px;padding:.85rem 1.1rem;margin-bottom:1rem}
.warn-box p{color:#7b5e1f;margin:0;font-size:13px}
.narrator-box{background:#e8e7e2;border-left:6px solid #a8a7a2;border-radius:0 18px 18px 0;padding:1.25rem 1.4rem;margin-bottom:1.3rem}
.narrator-box p{color:#1f2022;margin:0;font-size:14px;font-style:italic;line-height:1.5}
.narrator-box .narrator-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#6f6f69;margin-bottom:.45rem;font-style:normal}
.participant-card{background:#e8e7e2;border:1px solid #cfcfca;border-radius:22px;padding:1.6rem;margin-bottom:1.1rem}
.participant-card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6f6f69;margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.ul{list-style:none;padding:0;margin-bottom:.95rem}
.ul li{font-size:14px;color:#3f3f41;line-height:1.6;padding-left:1.2rem;position:relative}
.ul li::before{content:"•";position:absolute;left:0;color:#787873}
.ol{padding-left:1.35rem;margin-bottom:.95rem}
.ol li{font-size:14px;color:#3f3f41;line-height:1.55}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6f6f69;margin-bottom:.55rem}
.divider{border:none;border-top:1px solid #d2d2d0;margin:1rem 0}
.option-btn{width:100%;text-align:left;padding:18px 24px;border:1px solid #cccccc;border-radius:18px;margin-bottom:.75rem;cursor:default;background:#f4f4f3;color:#1f2022;font-size:14px;display:flex;align-items:flex-start;gap:12px;pointer-events:none}
.option-btn.selected-show{border-color:#9ab7db;background:#dbe8f7}
.option-btn.selected-show .opt-label{color:#2d5fa8}
.option-btn.correct-chosen{border-color:#467a36;background:#d5e2cc}
.option-btn.correct-chosen .opt-label{color:#245723}
.option-btn.wrong-chosen{border-color:#b75b58;background:#f3d8d7}
.option-btn.wrong-chosen .opt-label{color:#8c2f2c}
.option-btn-active{pointer-events:auto;cursor:pointer;transition:border-color .15s,background .15s}
.option-btn-active:hover{border-color:#bdbdbd;background:#ededeb}
.option-btn-active.selected-show{border-color:#9ab7db;background:#dbe8f7}
.opt-label{font-size:13px;font-weight:600;min-width:26px;color:#464648}
.opt-text{font-size:14px;line-height:1.5;flex:1}
.progress-bar-wrap{background:#e4e4e1;border-radius:99px;height:10px;margin-bottom:1.55rem;overflow:hidden}
.progress-bar-fill{height:100%;background:#121314;border-radius:99px;transition:width .3s}
.q-meta{font-size:12px;color:#71716d;margin-bottom:.55rem}
.q-text{font-size:18px;font-weight:600;color:#161719;line-height:1.4;margin-bottom:1.2rem}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-left:8px}
.badge-correct{background:#d5e2cc;color:#245723}
.badge-wrong{background:#f3d8d7;color:#8c2f2c}
.phase-pill{display:inline-block;font-size:11px;font-weight:600;background:#ecece9;color:#6f6f69;border:1px solid #d0d0cb;border-radius:999px;padding:6px 18px;margin-bottom:1rem}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:1rem 0}
.score-card{background:#ecece9;border-radius:14px;padding:1rem;text-align:center}
.score-card .sc-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#70706c;margin-bottom:.25rem}
.score-card .sc-num{font-size:28px;font-weight:600;color:#17181a}
.score-card .sc-sub{font-size:12px;color:#6f6f69}
.consent-row{display:flex;align-items:flex-start;gap:8px;padding:.6rem 0;border-bottom:1px solid #d2d2d0}
.consent-row:last-child{border-bottom:none}
.consent-row label{font-size:14px;color:#1f2022;cursor:pointer;line-height:1.5}
.survey-title{font-size:22px;font-weight:600;color:#1f1f20;margin-bottom:.25rem}
.survey-item{margin-top:1.1rem}
.survey-question{font-size:14px;color:#3f3f41;line-height:1.6}
.survey-question strong{color:#c95252;font-weight:600}
.likert-row{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.likert-option{display:flex;align-items:center;gap:.35rem;cursor:pointer;color:#1f2022;font-size:14px}
.survey-check{display:flex;align-items:center;gap:.5rem;margin-top:1.2rem;color:#1f2022;font-size:14px}
.survey-comments{margin-top:1rem}
.survey-comments label{display:block;font-size:14px;font-weight:600;color:#1f2022;margin-bottom:.35rem}
.survey-comments textarea{width:100%;padding:.75rem;border:1px solid #c4c4c1;border-radius:14px;resize:vertical;font-family:inherit;font-size:14px;color:#1f2022;background:#f4f4f3}
input[type="checkbox"],input[type="radio"]{accent-color:#ff5959}
textarea:focus,input:focus,button:focus{outline:2px solid #99b9e0;outline-offset:2px}

@media (max-width: 900px){
  .study-card{padding:1.35rem}
  .study-title{font-size:22px}
  h1{font-size:34px}
  h2,.survey-title,.q-text{font-size:24px}
  p,.ul li,.ol li,.survey-question,.consent-row label,.likert-option,.survey-check,.survey-comments label,.q-meta,.phase-pill,.participant-card-label,.section-label,.narrator-box .narrator-label{font-size:14px}
  .btn,.btn-end{font-size:14px;padding:10px 18px}
  .opt-label{font-size:13px}
  .opt-text{font-size:14px}
  .narrator-box p,.info-box p,.success-box p,.warn-box p,.survey-comments textarea{font-size:14px}
}
</style>

<div id="app"></div>

<script>
const QUAL_QUESTIONS = [
  {text:"Make r the subject: p = q + r",opts:["r = p/q","r = p + q","r = p − q","r = q − p"],correct:2},
  {text:"Make d the subject: b = c − d",opts:["d = b/c","d = b + c","d = c − b","d = b − c"],correct:2},
  {text:"Simplify: 3x + 2y − x + 4y",opts:["2x + 6y","4x + 6y","2x + 2y","4x + 2y"],correct:0},
  {text:"Solve for x: 2x + 5 = 13",opts:["x = 4","x = 9","x = 3","x = 6"],correct:0},
  {text:"Area of a rectangle: length 8 cm, width 5 cm?",opts:["13 cm²","40 cm²","26 cm²","80 cm²"],correct:1},
  {text:"Gradient of the line y = 3x − 7?",opts:["−7","7","3","1/3"],correct:2},
  {text:"Perimeter of a square with side 6 cm?",opts:["12 cm","18 cm","24 cm","36 cm"],correct:2},
  {text:"Expand: (x + 3)(x − 2)",opts:["x² + x − 6","x² − x − 6","x² + x + 6","x² + 5x − 6"],correct:0},
  {text:"Value of x² when x = −4?",opts:["−16","8","16","−8"],correct:2},
  {text:"Solve: 3x − 4 = 2x + 1",opts:["x = 3","x = 5","x = −3","x = 1"],correct:1},
  {text:"Angles in a triangle sum to:",opts:["90°","180°","270°","360°"],correct:1},
  {text:"Area of a circle with radius 7 (π ≈ 3.14)?",opts:["43.96","153.86","21.98","21"],correct:1},
];

const QUAL_PARTICIPANT_ANSWERS = [2,2,0,0,1,2,2,0,2,1,1,1];

const REPLAY_DATA = [
  {q:"Solve for x: 5x + 3 = 28",opts:["x = 4","x = 5","x = 6","x = 3"],chosen:1,correct:true},
  {q:"Gradient of y = −2x + 4?",opts:["4","2","−2","−4"],chosen:2,correct:true},
  {q:"Expand: (x + 4)(x − 1)",opts:["x²+3x−4","x²+5x−4","x²−3x−4","x²+3x+4"],chosen:0,correct:true},
  {q:"Area of triangle: base 10, height 6?",opts:["60","30","16","120"],chosen:1,correct:true},
  {q:"Simplify: 4a − 2b + a + 3b",opts:["5a+b","3a+b","5a−b","3a+5b"],chosen:0,correct:true},
  {q:"Make y the subject: x = 3y − 9",opts:["y=(x+9)/3","y=3x+9","y=(x−9)/3","y=x/3+9"],chosen:2,correct:false},
  {q:"What is 7² − 3²?",opts:["16","40","58","49"],chosen:1,correct:true},
  {q:"Perimeter of a rectangle: length 9, width 4?",opts:["36","13","26","18"],chosen:2,correct:true},
  {q:"Solve: 2(x + 3) = 14",opts:["x = 4","x = 7","x = 8","x = 5"],chosen:0,correct:true},
  {q:"Value of 3x² when x = 2?",opts:["12","36","24","6"],chosen:0,correct:false},
  {q:"Interior angles of a regular hexagon each measure:",opts:["60°","90°","120°","150°"],chosen:2,correct:true},
  {q:"If y = x² − 4, what is y when x = 3?",opts:["5","9","−1","13"],chosen:0,correct:true},
  {q:"Factorise: x² + 5x + 6",opts:["(x+2)(x+3)","(x+1)(x+6)","(x+3)(x+4)","(x−2)(x−3)"],chosen:0,correct:true},
  {q:"Simplify: (2x³)(3x²)",opts:["5x⁵","6x⁵","6x⁶","5x⁶"],chosen:1,correct:true},
  {q:"Distance from origin to (3, 4)?",opts:["7","5","1","25"],chosen:1,correct:true},
  {q:"Solve: x/4 + 2 = 5",opts:["x = 12","x = 28","x = 3","x = 7"],chosen:0,correct:true},
  {q:"Volume of a cuboid: 4 × 3 × 5?",opts:["24","60","36","47"],chosen:1,correct:true},
  {q:"Make b the subject: a = 2b + c",opts:["b=(a−c)/2","b=2a−c","b=(a+c)/2","b=a/2+c"],chosen:0,correct:true},
  {q:"Sum of exterior angles of any polygon?",opts:["180°","270°","360°","540°"],chosen:2,correct:true},
  {q:"Solve: 3x² = 48",opts:["x = 4","x = ±4","x = 16","x = 8"],chosen:1,correct:true},
  {q:"Line through (0,2) and (3,8): gradient?",opts:["2","3","6","1/2"],chosen:0,correct:false},
  {q:"Expand: 3(2x − 5)",opts:["6x−15","6x+15","6x−5","3x−15"],chosen:0,correct:true},
  {q:"Simplify: (x²)³",opts:["x⁵","x⁶","x⁸","3x²"],chosen:1,correct:true},
  {q:"Circumference of circle, radius 5 (π ≈ 3.14)?",opts:["15.7","31.4","78.5","10"],chosen:1,correct:true},
  {q:"Solve: |x − 3| = 5",opts:["x = 8","x = −2","x = 8 or x = −2","x = 2 or x = 8"],chosen:2,correct:true},
  {q:"If f(x) = 2x + 1, find f(4)",opts:["7","8","9","10"],chosen:2,correct:false},
  {q:"Sum of first 5 natural numbers?",opts:["10","15","12","20"],chosen:1,correct:true},
  {q:"Factorise: 6x² + 9x",opts:["3x(2x+3)","6x(x+3)","3(2x²+3x)","x(6x+9)"],chosen:0,correct:true},
  {q:"Angle in a semicircle is always:",opts:["45°","60°","90°","180°"],chosen:2,correct:true},
  {q:"Solve: 2x² − x − 3 = 0",opts:["x=1 or x=−3/2","x=3/2 or x=−1","x=3 or x=−1","x=−3 or x=1"],chosen:1,correct:true},
  {q:"nth term of 3, 7, 11, 15...?",opts:["4n−1","3n+1","4n+3","n+4"],chosen:0,correct:true},
  {q:"Midpoint of (2,4) and (6,10)?",opts:["(4,7)","(8,14)","(3,5)","(4,6)"],chosen:0,correct:true},
  {q:"If P(A) = 0.3, what is P(not A)?",opts:["0.3","0.7","0.6","1.3"],chosen:1,correct:true},
  {q:"Solve: log₂(x) = 3",opts:["x = 6","x = 8","x = 9","x = 2"],chosen:1,correct:true},
  {q:"Circle x² + y² = 25 has radius:",opts:["25","5","10","√25"],chosen:1,correct:true},
  {q:"Gradient perpendicular to y = 2x + 1?",opts:["2","−2","1/2","−1/2"],chosen:3,correct:true},
  {q:"Simplify: (x+3)/(x²−9)",opts:["1/(x−3)","1/(x+3)","x/(x−3)","1/(x²−9)"],chosen:0,correct:true},
  {q:"Area of sector: radius 6, angle 60°?",opts:["6π","18.8","12π","3π"],chosen:0,correct:true},
  {q:"Mean of 4, 7, 10, 13, 16?",opts:["9","10","11","12"],chosen:1,correct:true},
  {q:"Solve: eˣ = 7 (to 2 d.p.)",opts:["1.95","1.75","2.08","1.89"],chosen:0,correct:false},
  {q:"If cos(θ) = 0.5, find θ (0–360°)?",opts:["60°","60° and 300°","30° and 330°","120° and 240°"],chosen:1,correct:true},
  {q:"Binomial expansion of (1 + x)²?",opts:["1+x²","1+2x+x²","1+x+x²","2+2x"],chosen:1,correct:true},
  {q:"Differentiate: f(x) = 3x² + 2x",opts:["6x+2","3x+2","6x","3x²+2"],chosen:0,correct:true},
  {q:"Integrate: ∫2x dx",opts:["2x²+c","x²+c","x²","4x+c"],chosen:1,correct:true},
  {q:"Vector (3,4) has magnitude:",opts:["7","5","25","1"],chosen:1,correct:true},
  {q:"If A and B are independent, P(A∩B) = ?",opts:["P(A)+P(B)","P(A)·P(B)","P(A|B)","P(A)−P(B)"],chosen:1,correct:true},
  {q:"Geometric series: a=2, r=3, n=4. Sum?",opts:["80","162","26","40"],chosen:0,correct:true},
  {q:"Discriminant b²−4ac > 0 means:",opts:["No real roots","One repeated root","Two distinct real roots","Complex roots"],chosen:2,correct:true},
  {q:"f(x) = x³. Find f′(2).",opts:["6","12","4","8"],chosen:1,correct:true},
  {q:"Solve: 2x + y = 7 and x − y = 2",opts:["x=2,y=3","x=3,y=1","x=3,y=2","x=4,y=−1"],chosen:1,correct:true},
];

const POST_SURVEY_ITEMS = [
  {key:"accomplishment",label:"Feeling of Accomplishment",text:"How much do you feel that the recommended questions helped you improve your understanding of the topic?"},
  {key:"effort",label:"Effort Required",text:"How much effort was required to follow the recommendations and work through the questions?"},
  {key:"mental",label:"Mental Demand",text:"How mentally demanding was it to understand and solve the recommended questions?"},
  {key:"control",label:"Perceived Controllability",text:"How well did the difficulty of the recommended questions match your current level throughout the session?"},
  {key:"temporal",label:"Temporal Demand",text:"How time-pressured did you feel while completing the recommended questions within the allotted time?"},
  {key:"frustration",label:"Frustration",text:"How frustrated did you feel while working with the recommended questions?"},
  {key:"trust",label:"Trust",text:"How much did you trust the system to recommend appropriate questions for your learning progress?"},
];

let state = {
  screen:"landing",
  qualPage:"instructions",
  qualQIndex:0,
  replayIndex:0,
  replayPhase:"question",
  postAnswers:{},
  postUseAgain:false,
  postComments:"",
};

function go(s){state.screen=s;render()}

function card(body){
  return `<div class="screen active"><div class="study-card">
    <div class="study-title">Answer Math Questions and Share Your Experience</div>
    ${body}
  </div></div>`;
}

function narratorBox(label,text){
  return `<div class="narrator-box"><div class="narrator-label">${label}</div><p>${text}</p></div>`;
}

function participantCard(label,body){
  return `<div class="participant-card"><div class="participant-card-label"><i class="ti ti-user" aria-hidden="true"></i>${label}</div>${body}</div>`;
}

function renderLanding(){
  return card(`
    <h1>Answer Math Questions and Share Your Experience</h1>
    <p>Welcome! In this study, you will observe how another participant worked through a Math question session, and then answer a short post-study survey at the end.</p>
    <p>The questions cover <strong>Fundamental Mathematics</strong> — mainly algebra and geometry. You do not need to be a math expert.</p>
    <div class="section-label" style="margin-top:1rem">Study structure</div>
    <ol class="ol">
      <li>A short qualification test (12 questions)</li>
      <li>Observe another participant's full session — you will see the questions they faced and how they answered</li>
      <li>Post-study survey based on what you observed</li>
    </ol>
    <div class="info-box"><p><i class="ti ti-info-circle" aria-hidden="true"></i> Participation is voluntary. You may stop at any time using the <strong>End session</strong> button.</p></div>
    <div class="btn-row"><button class="btn btn-primary" onclick="go('consent')">Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button></div>
  `);
}

function renderConsent(){
  return card(`
    <div class="phase-pill">Consent</div>
    <h1>Consent and data use</h1>
    <p>This study is conducted for research purposes to examine how people learn by observing others interact with a Math question recommendation system.</p>
    <div class="section-label">During the session, we will record:</div>
    <ul class="ul">
      <li>Your answers in the post-study survey</li>
      <li>Your response times in the post-study survey</li>
      <li>Basic interaction events needed to run the study (e.g., time spent viewing each observed question)</li>
    </ul>
    <hr class="divider">
    <div style="color:var(--color-text-info);font-size:13px;font-weight:500;margin-bottom:.5rem">Privacy</div>
    <ul class="ul">
      <li>No personally identifying information is collected beyond your PROLIFIC_ID, which is used only to manage participation and payment</li>
      <li>Your PROLIFIC_ID will not be linked to any published results</li>
    </ul>
    <div style="color:var(--color-text-info);font-size:13px;font-weight:500;margin:.75rem 0 .5rem">Voluntary participation</div>
    <ul class="ul">
      <li>Your participation is voluntary and you may stop at any time by clicking the <strong>End session</strong> button</li>
    </ul>
    <div style="color:var(--color-text-info);font-size:13px;font-weight:500;margin:.75rem 0 .5rem">Compensation</div>
    <p>The base payment covers the qualification test. Completing the observation phase and post-study survey qualifies you for a bonus payment.</p>
    <hr class="divider">
    <div class="consent-row">
      <input type="checkbox" id="consent-check" style="margin-top:3px;cursor:pointer">
      <label for="consent-check">I consent to participate.</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" id="consent-btn" onclick="checkConsent()" disabled>Continue to qualification test</button>
    </div>
  `);
}

function renderQual(){
  if(state.qualPage==="instructions") return renderQualInstructions();
  if(state.qualPage==="transition") return renderQualTransition();
  if(state.qualPage==="questions") return renderQualQuestions();
  if(state.qualPage==="results") return renderQualResults();
}

function renderQualInstructions(){
  return card(`
    <div class="phase-pill">Qualification test — what the participant saw</div>
    <h1>The participant first took a qualification test</h1>
    ${narratorBox("You are observing","Before the main session, the participant completed a 12-question qualification test. This test covered Fundamental Mathematics — mainly algebra and geometry — across a range of difficulty levels. It was used to ensure the questions recommended to them later were appropriate for their skill level.")}
    <p>Below are the instructions the participant saw before starting the test.</p>
    ${participantCard("Instructions shown to the participant",`
      <p style="font-size:14px;color:var(--color-text-primary);margin-bottom:.5rem"><strong>Phase 1: Qualification Test (12 questions)</strong></p>
      <p style="font-size:13px">You will answer 12 Math questions covering Fundamental Mathematics, mainly:</p>
      <ul class="ul" style="margin:.5rem 0">
        <li>Algebra fundamentals</li>
        <li>Geometry fundamentals</li>
      </ul>
      <p style="font-size:13px">The questions span a range of difficulty levels. This phase helps ensure that the questions shown later are appropriate for you.</p>
      <p style="font-size:13px;margin-top:.5rem"><em>Important notes</em></p>
      <ul class="ul">
        <li>Please answer each question to the best of your ability</li>
        <li>Take your time; response times are also recorded</li>
      </ul>
    `)}
    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="state.qualPage='transition';render()">Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderQualTransition(){
  return card(`
    <div class="phase-pill">Qualification test — what the participant saw</div>
    <h1>Now you will see the qualification test questions and the participant's answers</h1>
    ${narratorBox("You are observing","The participant then worked through all 12 questions one by one. On the following screens, you will see each question as the participant saw it, along with the answer they chose and whether it was correct or incorrect. Click <strong>Next</strong> to go through each question.")}
    <div class="info-box"><p><i class="ti ti-eye" aria-hidden="true"></i> Pay close attention — the post-study survey at the end asks about this experience.</p></div>
    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="state.qualPage='questions';state.qualQIndex=0;render()">View qualification test answers <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderQualQuestions(){
  const i = state.qualQIndex;
  const q = QUAL_QUESTIONS[i];
  const chosen = QUAL_PARTICIPANT_ANSWERS[i];
  const isCorrect = chosen === q.correct;
  const pct = Math.round((i/12)*100);
  return card(`
    <div class="q-meta">Qualification test — participant's answers · Question ${i+1} of 12</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    ${narratorBox("You are observing","This is how the participant answered question ${i+1}.")}
    <div class="q-text">${q.text}</div>
    ${q.opts.map((o,oi)=>{
      let cls="option-btn";
      let badge="";
      if(oi===chosen){
        cls = isCorrect ? "option-btn correct-chosen" : "option-btn wrong-chosen";
        badge = isCorrect
          ? `<span class="badge badge-correct"><i class="ti ti-check" aria-hidden="true"></i> Correct</span>`
          : `<span class="badge badge-wrong"><i class="ti ti-x" aria-hidden="true"></i> Incorrect</span>`;
      }
      return `<div class="${cls}">
        <span class="opt-label">${String.fromCharCode(65+oi)}</span>
        <span class="opt-text">${o} ${badge}</span>
      </div>`;
    }).join("")}
    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="nextQualQ()">${i===11?"See qualification results":"Next question <i class='ti ti-arrow-right' aria-hidden='true'></i>"}</button>
    </div>
  `);
}

function renderQualResults(){
  return card(`
    <div class="phase-pill">Qualification test — what the participant saw</div>
    <h1>The participant completed the qualification test</h1>
    ${narratorBox("You are observing","After completing all 12 questions, the participant saw a confirmation message that they could proceed to the learning session.")}
    ${participantCard("Result screen shown to the participant",`
      <div class="success-box" style="margin-top:.5rem"><p><i class="ti ti-circle-check" aria-hidden="true"></i> Thank you! You can continue to the learning phase.</p></div>
    `)}
    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="go('replay-intro')">Continue to observation phase <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderReplayIntro(){
  return card(`
    <div class="phase-pill">Observation phase</div>
    <h1>Now you will observe the participant's full question session</h1>
    ${narratorBox("You are observing","Having passed the qualification test, the participant moved on to the main question session. They worked through up to 10 sets of 5 questions each — 50 questions in total. The system recommended questions based on their previous answers.")}
    <p>For each question, you will first see the question and the answer options. Click <strong>Reveal answer</strong> to see which answer the participant chose and whether it was correct. Then click <strong>Next question</strong> to continue.</p>
    <div class="info-box"><p><i class="ti ti-bulb" aria-hidden="true"></i> Pay close attention — a post-study survey follows this observation phase.</p></div>
    <ul class="ul">
      <li>You cannot go back to previous questions</li>
      <li>Your time spent on each question is recorded</li>
    </ul>
    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="startReplay()">Start observation <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderReplay(){
  const i = state.replayIndex;
  const q = REPLAY_DATA[i];
  const pct = Math.round((i/50)*100);
  const setNum = Math.floor(i/5)+1;
  const qInSet = (i%5)+1;
  const revealed = state.replayPhase==="revealed";
  return card(`
    <div class="q-meta">Observation · Set ${setNum} of 10 · Question ${qInSet} of 5 · ${i+1} of 50 total</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    ${narratorBox("You are observing","This is the question the participant saw. Click <strong>Reveal answer</strong> to see what they chose.")}
    <div class="q-text">${q.q}</div>
    ${q.opts.map((o,oi)=>{
      let cls="option-btn";
      let badge="";
      if(revealed && oi===q.chosen){
        cls = q.correct ? "option-btn correct-chosen" : "option-btn wrong-chosen";
        badge = q.correct
          ? `<span class="badge badge-correct"><i class="ti ti-check" aria-hidden="true"></i> Correct</span>`
          : `<span class="badge badge-wrong"><i class="ti ti-x" aria-hidden="true"></i> Incorrect</span>`;
      }
      return `<div class="${cls}"><span class="opt-label">${String.fromCharCode(65+oi)}</span><span class="opt-text">${o} ${badge}</span></div>`;
    }).join("")}
    <div class="btn-row">
      <button class="btn btn-end" onclick="endReplayEarly()"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      ${!revealed
        ? `<button class="btn btn-primary" onclick="revealAnswer()"><i class="ti ti-eye" aria-hidden="true"></i> Reveal answer</button>`
        : `<button class="btn btn-primary" onclick="nextReplay()">Next question <i class="ti ti-arrow-right" aria-hidden="true"></i></button>`}
    </div>
  `);
}

function renderBetweenSets(){
  const setNum = Math.floor(state.replayIndex/5);
  return card(`
    <div style="text-align:center;padding:.75rem 0 1rem">
      <div style="font-size:32px;color:var(--color-text-tertiary);margin-bottom:.75rem"><i class="ti ti-checks" aria-hidden="true"></i></div>
      <h2>Set ${setNum} of 10 observed</h2>
      <p style="margin:.5rem 0 1.25rem">Take a moment if needed, then continue to the next set.</p>
      <div class="progress-bar-wrap" style="max-width:240px;margin:0 auto .75rem"><div class="progress-bar-fill" style="width:${Math.round((state.replayIndex/50)*100)}%"></div></div>
      <p style="font-size:12px;color:var(--color-text-tertiary)">${state.replayIndex} of 50 questions observed</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-end" onclick="endReplayEarly()"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="go('replay')">Continue to set ${setNum+1} <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderReplayComplete(){
  return card(`
    <div style="text-align:center;padding:.75rem 0 1rem">
      <div style="font-size:32px;color:var(--color-text-tertiary);margin-bottom:.75rem"><i class="ti ti-eye-check" aria-hidden="true"></i></div>
      <h1>Observation complete</h1>
      <p>You have observed all 50 questions from the participant's session.</p>
    </div>
    <div class="success-box"><p>You will now complete a short post-study survey based on what you observed.</p></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="go('posteval-intro')">Continue to post-study survey <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderPostEvalIntro(){
  return card(`
    <div class="phase-pill">Post-study survey</div>
    <h1>Post-Study Survey</h1>
    ${narratorBox("Your task","You will now answer the same post-study survey that the participant you observed completed. Please rate each item from 1 (low) to 5 (high) based on what you observed during the session.")}
    <ul class="ul">
      <li>No feedback will be given during the survey</li>
      <li>Your responses are recorded</li>
      <li>Please answer all questions thoughtfully</li>
    </ul>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startPostEval()">Start post-study survey <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
  `);
}

function renderPostEval(){
  const ready = POST_SURVEY_ITEMS.every((item)=>state.postAnswers[item.key]!==undefined);
  return card(`
    <div class="q-meta">Post-study survey</div>
    <h2 class="survey-title">Please rate each statement from 1 to 5</h2>
    ${POST_SURVEY_ITEMS.map((item)=>`
      <div class="survey-item">
        <div class="survey-question"><strong>${item.label}:</strong> ${item.text}</div>
        <div class="likert-row">
          ${[1,2,3,4,5].map((v)=>`
            <label class="likert-option">
              <input type="radio" name="post-${item.key}" value="${v}" ${state.postAnswers[item.key]===v?'checked':''} onchange="selectPost('${item.key}',${v})">
              <span>${v}</span>
            </label>
          `).join("")}
        </div>
      </div>
    `).join("")}

    <label class="survey-check">
      <input type="checkbox" ${state.postUseAgain?'checked':''} onchange="toggleUseAgain(this.checked)">
      <span>I would use such a system again.</span>
    </label>

    <div class="survey-comments">
      <label for="post-comments">Any comments?</label>
      <textarea id="post-comments" rows="4" oninput="updateComments(this.value)">${state.postComments || ""}</textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-end" onclick="go('ended')"><i class="ti ti-x" aria-hidden="true"></i> End session</button>
      <button class="btn btn-primary" onclick="submitPostSurvey()" ${ready?'':'disabled'}>
        Submit survey <i class="ti ti-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  `);
}

function renderThankYou(){
  return card(`
    <h1>Thank you!</h1>
    <p>Thank you for participating in this research study. Your responses will help us evaluate how people learn by observing others interact with a Math recommendation system.</p>
    <div class="success-box"><p><i class="ti ti-circle-check" aria-hidden="true"></i> Your post-study survey has been submitted.</p></div>
    <div class="score-row">
      <div class="score-card"><div class="sc-label">Questions observed</div><div class="sc-num">50</div><div class="sc-sub">10 sets × 5 questions</div></div>
      <div class="score-card"><div class="sc-label">Survey items completed</div><div class="sc-num">7</div><div class="sc-sub">1 to 5 scale</div></div>
    </div>
    <p style="font-size:13px">You will now be redirected to Prolific to submit the study and receive payment.</p>
    <p style="font-size:13px">If you are not redirected automatically, please <a href="#">click here to return to Prolific</a>.</p>
  `);
}

function renderEnded(){
  return card(`
    <div style="text-align:center;padding:1.5rem 0">
      <div style="font-size:32px;color:var(--color-text-tertiary);margin-bottom:.75rem"><i class="ti ti-door-exit" aria-hidden="true"></i></div>
      <h2>Session ended</h2>
      <p>Your session has been recorded. You will be redirected to Prolific to submit the study and receive your base payment.</p>
      <p style="font-size:13px;margin-top:.5rem">If you are not redirected automatically, please <a href="#">click here to return to Prolific</a>.</p>
    </div>
  `);
}

function render(){
  const s = state.screen;
  let html = "";
  if(s==="landing") html=renderLanding();
  else if(s==="consent") html=renderConsent();
  else if(s==="qual") html=renderQual();
  else if(s==="replay-intro") html=renderReplayIntro();
  else if(s==="replay") html=renderReplay();
  else if(s==="between-sets") html=renderBetweenSets();
  else if(s==="replay-complete") html=renderReplayComplete();
  else if(s==="posteval-intro") html=renderPostEvalIntro();
  else if(s==="posteval") html=renderPostEval();
  else if(s==="thankyou") html=renderThankYou();
  else if(s==="ended") html=renderEnded();
  document.getElementById("app").innerHTML=html;
  attachHandlers();
}

function attachHandlers(){
  const cc=document.getElementById("consent-check");
  const cb=document.getElementById("consent-btn");
  if(cc&&cb){ cc.addEventListener("change",()=>{cb.disabled=!cc.checked;}); if(cc.checked) cb.disabled=false; }
}

function checkConsent(){
  const cc=document.getElementById("consent-check");
  if(cc&&cc.checked){ state.qualPage="instructions"; go("qual"); }
}

function nextQualQ(){
  if(state.qualQIndex===11){ state.qualPage="results"; render(); }
  else { state.qualQIndex++; render(); }
}

function startReplay(){ state.replayIndex=0; state.replayPhase="question"; go("replay"); }
function revealAnswer(){ state.replayPhase="revealed"; render(); }

function nextReplay(){
  const next=state.replayIndex+1;
  if(next>=50){ go("replay-complete"); return; }
  state.replayIndex=next;
  state.replayPhase="question";
  if(next%5===0) go("between-sets");
  else go("replay");
}

function endReplayEarly(){
  if(state.replayIndex>=5) go("posteval-intro");
  else go("ended");
}

function startPostEval(){
  state.postAnswers={};
  state.postUseAgain=false;
  state.postComments="";
  go("posteval");
}

function selectPost(key, value){
  state.postAnswers[key]=value;
  render();
}

function toggleUseAgain(checked){
  state.postUseAgain=checked;
}

function updateComments(value){
  state.postComments=value;
}

function submitPostSurvey(){
  const ready = POST_SURVEY_ITEMS.every((item)=>state.postAnswers[item.key]!==undefined);
  if(!ready) return;
  go("thankyou");
}

render();
</script>
