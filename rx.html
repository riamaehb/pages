<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b5c">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; frame-src blob:; object-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Rx Writer</title>
<style>
  :root { --ink:#1f2a2e; --muted:#5d6b70; --line:#d5dde0; --bg:#f4f7f6; --accent:#0f6b5c; --warn:#a33a2b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:1180px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:0 0 4px; text-transform:uppercase; letter-spacing:.03em; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; padding:10px 12px; min-height:44px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  button { font:inherit; font-weight:600; border:0; border-radius:7px; padding:10px 18px; min-height:44px; cursor:pointer; background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.link { background:none; color:var(--warn); padding:4px 6px; font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:var(--warn); font-size:13px; min-height:18px; margin-top:8px; }
  /* lock screen */
  #lock { max-width:360px; margin:12vh auto 0; }
  /* main */
  #main { display:none; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  .row { display:grid; gap:10px; margin-bottom:12px; }
  .r2 { grid-template-columns:1fr 1fr; } .r3 { grid-template-columns:2fr 1fr 1fr; }
  @media (max-width: 560px) {
    .wrap { padding:12px; } .card { padding:14px; }
    .r2, .r3 { grid-template-columns:1fr; }
    .bar button { flex:1 1 auto; }
  }
  #mobileOut { display:none; }
  h2 { font-size:14px; margin:18px 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .med { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; position:relative; }
  .med .num { position:absolute; top:-10px; left:10px; background:#fff; padding:0 6px; font-size:12px; font-weight:700; color:var(--accent); }
  .med .rm { position:absolute; top:-14px; right:8px; background:#fff; min-height:0; padding:2px 6px; font-size:13px; }
  .medgrid { display:grid; grid-template-columns: 1fr 90px; gap:8px; }
  .medgrid .sig { grid-column: 1 / -1; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .check { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:500; margin:0; }
  .check input { width:auto; min-height:0; }
  #lockNow { white-space:nowrap; }
  .med { margin-top:16px; }
  iframe { width:100%; height:640px; border:1px solid var(--line); border-radius:8px; background:#eee; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="lock" class="card">
    <h1>Rx Writer</h1>
    <p class="sub">Enter the password to unlock.</p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <div class="bar"><button id="unlockBtn" type="submit">Unlock</button></div>
      <div class="err" id="lockErr"></div>
    </form>
  </div>

  <div id="main">
    <div class="top">
      <div><h1>Rx Writer</h1><p class="sub">Locks automatically after 10 minutes of inactivity.</p></div>
      <button class="ghost" id="lockNow" type="button">Lock now</button>
    </div>
    <div class="grid">
      <div class="card">
        <h2 style="margin-top:0">Patient</h2>
        <div class="row"><select id="patient" aria-label="Patient"></select></div>
        <div id="otherFields" style="display:none">
          <div class="row r3">
            <div><label>Name</label><input id="oName"></div>
            <div><label>Sex</label><select id="oSex"><option>F</option><option>M</option></select></div>
            <div><label>Birthdate</label><input id="oDob" type="date"></div>
          </div>
        </div>
        <div class="row r2">
          <div><label>Address</label><input id="address"></div>
          <div><label>Out-Pt Dept Clinic</label><input id="clinic"></div>
        </div>
        <div class="row r2">
          <div><label>Rx date</label><input id="rxDate" type="date"></div>
          <div><label>Age (auto)</label><input id="age" readonly tabindex="-1"></div>
        </div>

        <h2>Medications</h2>
        <div id="meds"></div>
        <button class="ghost" id="addMed" type="button">+ Add medicine</button>

        <div class="bar">
          <button id="make" type="button">Generate PDF</button>
          <button class="ghost" id="dl" type="button" disabled>Download</button>
          <label class="check"><input type="checkbox" id="half"> Left half only (A5)</label>
        </div>
        <div class="err" id="mainErr"></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">Preview</h2>
        <iframe id="preview" title="Prescription preview"></iframe>
        <div id="mobileOut">
          <p class="note" id="mobileMsg">Generate the PDF, then open it to check before sending.</p>
          <div class="bar"><button id="openPdf" type="button" disabled>Open PDF</button><button class="ghost" id="sharePdf" type="button" disabled>Share</button></div>
        </div>
        <p class="note">Check the prescription before printing or sending.</p>
      </div>
    </div>
  </div>
</div>

const IDLE_MS = 10 * 60 * 1000;
const MAX_MEDS = 6;

let data = null;        // decrypted payload, only in memory
let lastPdfUrl = null, lastName = "", lastBytes = null;
let idleTimer = null, fails = 0, lockedUntil = 0;

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptVault(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(VAULT.salt), iterations: VAULT.iter },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

$("lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const now = Date.now();
  if (now < lockedUntil) { $("lockErr").textContent = `Too many attempts. Wait ${Math.ceil((lockedUntil-now)/1000)} s.`; return; }
  $("unlockBtn").disabled = true; $("lockErr").textContent = "Checking…";
  try {
    data = await decryptVault($("pw").value);
    $("pw").value = ""; fails = 0;
    $("lockErr").textContent = "";
    openMain();
  } catch {
    fails++;
    if (fails >= 3) lockedUntil = Date.now() + Math.min(300, 15 * 2 ** (fails - 3)) * 1000;
    $("lockErr").textContent = "Wrong password.";
  } finally { $("unlockBtn").disabled = false; }
});

function lock() {
  // Reload wipes all decrypted data and form contents from memory.
  if (lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
  location.reload();
}
$("lockNow").onclick = lock;
function bumpIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(lock, IDLE_MS); }
document.addEventListener("visibilitychange", () => { if (document.hidden && data) bumpIdle(); });

function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function ageOn(dobISO, onISO) {
  if (!dobISO || !onISO) return "";
  const [by,bm,bd] = dobISO.split("-").map(Number), [y,m,d] = onISO.split("-").map(Number);
  let a = y - by; if (m < bm || (m === bm && d < bd)) a--;
  return a >= 0 ? String(a) : "";
}
function fmtDate(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return `${String(m).padStart(2,"0")}/${String(d).padStart(2,"0")}/${y}`;
}

function openMain() {
  $("lock").style.display = "none"; $("main").style.display = "block";
  ["mousemove","keydown","click","touchstart"].forEach(ev => document.addEventListener(ev, bumpIdle, { passive:true }));
  bumpIdle();
  const sel = $("patient");
  data.patients.forEach((p, i) => sel.add(new Option(p.name, String(i))));
  sel.add(new Option("Other patient…", "other"));
  sel.onchange = selectPatient;
  $("rxDate").value = todayISO();
  $("clinic").value = data.defaultClinic || "";
  selectPatient();
  // Phones usually cannot show a PDF inside the page; offer Open/Share instead.
  if (navigator.pdfViewerEnabled === false || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    $("preview").style.display = "none"; $("mobileOut").style.display = "block";
  }
  addMed();
}

function current() {
  const v = $("patient").value;
  if (!v) return null;
  if (v === "other") return { name: $("oName").value.trim(), sex: $("oSex").value, dob: $("oDob").value };
  return data.patients[+v];
}
function selectPatient() {
  const v = $("patient").value;
  $("otherFields").style.display = v === "other" ? "block" : "none";
  $("address").value = v === "other" ? "" : (data.patients[+v].address || "");
  updateAge();
}
function updateAge() { const p = current(); $("age").value = p ? ageOn(p.dob, $("rxDate").value) : ""; }
["rxDate","oDob"].forEach(id => $(id).addEventListener("input", updateAge));

function addMed() {
  const n = $("meds").children.length;
  if (n >= MAX_MEDS) return;
  const d = document.createElement("div"); d.className = "med";
  d.innerHTML = `<span class="num"></span><button class="link rm" type="button" title="Remove">Remove</button>
    <div class="medgrid">
      <div><label>Medicine</label><input class="m-name" placeholder="Generic, strength, form"></div>
      <div><label>Qty</label><input class="m-qty" placeholder="#" inputmode="numeric"></div>
      <div class="sig"><label>Sig.</label><input class="m-sig" placeholder="e.g. 1 tab once a day in the morning"></div>
    </div>`;
  d.querySelector(".rm").onclick = () => { d.remove(); renumber(); };
  $("meds").appendChild(d); renumber();
  d.querySelector(".m-name").focus();
}
function renumber() {
  [...$("meds").children].forEach((d,i) => d.querySelector(".num").textContent = i + 1);
  $("addMed").disabled = $("meds").children.length >= MAX_MEDS;
}
$("addMed").onclick = addMed;

function wrap(text, font, size, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (font.widthOfTextAtSize(t, size) <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
// Helvetica (WinAnsi) cannot draw every character; replace the common ones.
const clean = s => s.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-")
                    .replace(/½/g,"1/2").replace(/¼/g,"1/4").replace(/[^\x20-\x7E -ÿ]/g,"");

$("make").onclick = async () => {
  $("mainErr").textContent = "";
  const p = current();
  const meds = [...$("meds").children].map(d => ({
    name: clean(d.querySelector(".m-name").value.trim()),
    qty: clean(d.querySelector(".m-qty").value.trim().replace(/^#/, "")),
    sig: clean(d.querySelector(".m-sig").value.trim()),
  })).filter(m => m.name || m.sig || m.qty);
  const problems = [];
  if (!p || !p.name) problems.push("patient name");
  if (!p || !p.dob) problems.push("birthdate");
  if (!meds.length) problems.push("at least one medicine");
  meds.forEach((m,i) => { if (!m.name || !m.sig || !m.qty) problems.push(`medicine ${i+1} needs name, Sig. and Qty`); });
  if (problems.length) { $("mainErr").textContent = "Missing: " + problems.join("; "); return; }

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(b64(data.pdf));
  const page = doc.getPage(0);
  const H = page.getHeight();
  const f = await doc.embedFont(StandardFonts.Helvetica);
  const fb = await doc.embedFont(StandardFonts.HelveticaBold);
  const ink = rgb(0.05, 0.1, 0.35);
  const y = top => H - top;   // template coordinates measured from the top edge
  const put = (t, x, top, size = 9, font = f) => page.drawText(clean(t), { x, y: y(top), size, font, color: ink });
  const fit = (t, x, top, maxW, size = 9) => { while (size > 6 && f.widthOfTextAtSize(clean(t), size) > maxW) size -= 0.5; put(t, x, top, size); };

  const rxDate = $("rxDate").value;
  fit(p.name, 80, 119, 104);
  put(ageOn(p.dob, rxDate), 214, 119);
  put(p.sex, 266, 119);
  fit(fmtDate(rxDate), 320, 119, 56, 8.5);
  fit($("address").value.trim(), 95, 131, 104);
  fit($("clinic").value.trim(), 293, 131, 84);

  // Replace the [MEDICATIONS] placeholder with "Rx" and list items.
  page.drawRectangle({ x: 48, y: y(174), width: 100, height: 16, color: rgb(1,1,1) });
  page.drawText("Rx", { x: 52, y: y(171), size: 16, font: fb, color: ink });

  let top = 196; const X = 66, R = 370, LH = 12.5, bottom = 492;
  for (const [i, m] of meds.entries()) {
    // Medicine name, then dot leaders filling the gap up to the right-aligned quantity.
    const qty = `#${m.qty}`, qW = f.widthOfTextAtSize(qty, 10);
    const nameLines = wrap(m.name, fb, 10, R - X - qW - 20);
    put(`${i+1}.`, 54, top, 10, fb);
    nameLines.forEach((ln, j) => {
      put(ln, X, top, 10, fb);
      if (j === nameLines.length - 1) {
        const start = X + fb.widthOfTextAtSize(ln, 10) + 4, end = R - qW - 4;
        const dotW = f.widthOfTextAtSize(".", 10), n = Math.max(3, Math.floor((end - start) / dotW));
        page.drawText(".".repeat(n), { x: end - n * dotW, y: y(top), size: 10, font: f, color: ink });
        put(qty, R - qW, top, 10);
      }
      top += LH;
    });
    wrap("Sig: " + m.sig, f, 9.5, R - X).forEach(ln => { put(ln, X + 6, top, 9.5); top += LH; });
    top += 8;
  }
  if (top - 8 > bottom) { $("mainErr").textContent = "Too much text to fit above the signature. Shorten entries or split into two prescriptions."; return; }

  if ($("half").checked) { const w = page.getWidth() / 2; page.setMediaBox(0, 0, w, H); page.setCropBox(0, 0, w, H); }
  doc.setTitle("Prescription"); doc.setProducer("Rx Writer"); doc.setCreator("Rx Writer");
  const bytes = await doc.save();
  if (lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
  lastPdfUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  lastBytes = bytes;
  lastName = `Rx_${p.name.replace(/[^A-Za-z0-9]+/g, "_")}_${rxDate}.pdf`;
  $("preview").src = lastPdfUrl;
  $("dl").disabled = false; $("openPdf").disabled = false;
  $("sharePdf").disabled = !(navigator.canShare && navigator.canShare({ files: [pdfFile()] }));
  $("mobileMsg").textContent = "PDF ready. Open it to check, then share or print.";
};
function pdfFile() { return new File([lastBytes || new Uint8Array()], lastName || "Rx.pdf", { type: "application/pdf" }); }
$("openPdf").onclick = () => { if (lastPdfUrl) window.open(lastPdfUrl, "_blank"); };
$("sharePdf").onclick = async () => {
  try { await navigator.share({ files: [pdfFile()], title: "Prescription" }); } catch (e) { /* cancelled */ }
};

$("dl").onclick = () => {
  if (!lastPdfUrl) return;
  const a = document.createElement("a"); a.href = lastPdfUrl; a.download = lastName; a.click();
};
</script>
