<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>IS 295 Capstone Advisers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    color-scheme: light;
    --maroon: #7B1113;
    --maroon-dark: #5c0c0e;
    --green: #014421;
    --gold: #F3AA2C;
    --paper: #ffffff;
    --ink: #221b1b;
    --muted: #6a5f60;
    --line: #e9e1e1;
    --tint: #faf5f5;
    --green-tint: #eef5f1;
    --serif: Arial, Helvetica, "Liberation Sans", sans-serif;
    --sans: Arial, Helvetica, "Liberation Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.6 var(--sans); padding-inline: 20px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-block: 0 64px; }

  /* Header */
  .masthead { border-top: 6px solid var(--maroon); padding-block: 32px 24px; display: grid; gap: 8px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin: 0; }
  h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; color: var(--maroon); margin: 0; text-wrap: balance; }
  .lede { margin: 4px 0 0; max-width: 62ch; color: var(--muted); font-size: 16px; }

  .steps { list-style: none; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; counter-reset: s; }
  .steps li { counter-increment: s; background: var(--tint); border-radius: 10px; padding: 14px 16px 14px 52px; position: relative; font-size: 14px; line-height: 1.5; }
  .steps li::before { content: counter(s); position: absolute; left: 16px; top: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--maroon); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .steps b { display: block; color: var(--ink); }
  .steps span { color: var(--muted); }

  /* Toolbar */
  .toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  #q { width: 100%; font: inherit; font-size: 15px; padding: 11px 14px 11px 42px; border: 1px solid #d8cdcd; border-radius: 10px; background: #fff; color: var(--ink); }
  #q:focus { outline: 2px solid var(--maroon); outline-offset: 1px; border-color: var(--maroon); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 13px/1 var(--sans); padding: 8px 12px; border-radius: 999px; border: 1px solid #d8cdcd; background: #fff; color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--maroon); color: var(--maroon); }
  .chip[aria-pressed="true"] { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .chip:focus-visible, .card button:focus-visible, .close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .count { font-size: 13px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: #fff; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .15s, border-color .15s; }
  .card:hover { border-color: #d9c3c3; box-shadow: 0 6px 20px rgba(123,17,19,.08); }
  .card .top { display: flex; gap: 14px; align-items: center; padding: 18px 18px 12px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex: none; background: var(--tint); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .avatar.initials { display: grid; place-items: center; font: 700 24px var(--serif); color: var(--maroon); }
  .card h2 { font: 700 18px/1.25 var(--serif); margin: 0; color: var(--ink); text-wrap: balance; }
  .slots { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--green); background: var(--green-tint); border-radius: 999px; padding: 3px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .slots i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px; }
  .tag { font-size: 12px; font-weight: 500; color: var(--maroon-dark); background: var(--tint); border-radius: 6px; padding: 3px 8px; }
  .card .blurb { padding: 12px 18px 0; margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 16px; }
  .card button { margin: auto 18px 18px; font: 600 14px var(--sans); color: var(--maroon); background: #fff; border: 1px solid var(--maroon); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
  .card button:hover { background: var(--maroon); color: #fff; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }

  /* Dialog */
  dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 0; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); color: var(--ink); background: #fff; }
  dialog::backdrop { background: rgba(34,20,20,.55); }
  .d-head { display: flex; gap: 18px; align-items: center; padding: 24px 24px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
  .d-head .avatar { width: 96px; height: 96px; }
  .d-head .avatar.initials { font-size: 32px; }
  .d-head h2 { font: 700 24px/1.2 var(--serif); margin: 0; color: var(--maroon); }
  .close { margin-left: auto; align-self: flex-start; background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .close:hover { color: var(--ink); background: var(--tint); }
  .d-body { padding: 8px 24px 28px; }
  .d-body section { padding-top: 18px; }
  .d-body h3 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin: 0 0 6px; }
  .d-body p { margin: 0 0 10px; max-width: 68ch; }
  .d-body ul { margin: 0 0 10px; padding-left: 20px; max-width: 68ch; }
  .d-body li { margin-bottom: 4px; }
  .d-body .tags { padding: 0; }

  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .steps { grid-template-columns: 1fr; }
    body { padding-inline: 16px; }
    .d-head { padding: 18px; gap: 14px; }
    .d-head .avatar { width: 72px; height: 72px; }
    .d-head h2 { font-size: 20px; }
    .d-body { padding: 4px 18px 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

 "Data & Analytics", "Human-Computer Interaction"], "role": "", "bio": "I am an Assistant Professor at the University of the Philippines Open University (UPOU) specializing in Mathematics, IT, and Open and Distance e-Learning (ODeL). My work focuses on teaching computing and math, designing technology-enhanced learning environments, and leveraging Moodle through gamification, interactive activities, and learning analytics to boost student engagement.", "interests": "Visual Analytics & Cognitive Optimization: Investigating how interactive visualization and interface design influence human sensemaking, mental effort, and decision-making through the lens of Cognitive Load Theory. ODeL & Moodle Environments: Designing, deploying, and evaluating student- and instructor-facing Learning Analytics Dashboards within Moodle to support self-regulated learning and data-informed interventions in distance education. Gamification: Examining the cognitive and motivational impacts of gamified visual feedback (e.g., adaptive progress indicators, badges, achievement pathways) to enhance engagement", "projects": "I welcome capstone projects centered on educational technology, visual analytics, and learning dashboards within Moodle and Open and Distance e-Learning (ODeL). I am particularly interested in studies that apply data visualization, gamification, and cognitively informed design to improve student engagement, sensemaking, and decision-making.", "slots": 5}, {"name": "Koree Monteloyola-Cañizares", "sort": "monteloyola", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEYARgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAACAwUGAQcI/8QAUhAAAQMCBAMEBgUGCgcHBQAAAQACAwQRBRIhMQZBUQcTImEUMnGBkaEVUrGzwQgjQmJ10RYkJiczN0NTcuE1VWWDkvDxFyU2RWOClHOEk6Oy/8QAGwEAAgMBAQEAAAAAAAAAAAAAAQQAAgMFBgf/xAAxEQA h & Enterprise Systems", "Data & Analytics", "AI & Machine Learning", "Cybersecurity & Privacy", "Cloud & DevOps"], "role": "Lecturer", "bio": "I am a senior technology executive with more than 20 years of experience leading technology strategy, digital transformation, platform development, and operations across FinTech, InsurTech, F&B Technology, E-commerce, and Research-driven organizations, primarily in startups and high-growth environments.\n\nMy experience spans the full technology lifecycle, including enterprise architecture, product and software delivery, infrastructure, operations, cybersecurity, governance, and organizational leadership. I have built and led multidisciplinary teams across Product Management, UI/UX, Software Engineering, Quality Assurance, and DevOps and Tech Ops, while establishing the structures and practices needed to deliver secure, scalable, and reliable digital platforms.\n\nNotable achievements include leading the design and development of the digital insurance marketplace, B2C and B2B ordering and inventory platforms, web and mobile e-commerce buy and sell marketplace, and mobile taxi-hailing applications.", "interests": "• Financial Technology & Digital Banking — digital banking platforms, core banking modernization, financial services innovation, and technology-enabled inclusion.\n• Enterprise Architecture & Scalable Digital Platforms — architecture of large-scale, cloud-based, distributed, event-driven, and API-centric systems.\n• IT Governance, Technology Risk & Regulatory Compliance — governance frameworks, technology risk management, cybersecurity, resilience, and regulatory compliance, particularly in financial institutions.\n• Cloud Computing, DevOps & Technology Operations — cloud-native platforms, infrastructure modernization, automation, CI/CD, reliability, and operational resilience.\n• Digital Product & Platform Innovation — development and scaling of digital marketplaces, fintech products, e-commerce platforms, and technology-enabled services.\n• Data Engineering, Analytics & Data-Driven Decision Making — data architecture, databases, analytics, information systems, and use of data for operational and strategic decision-making.\n• Artificial Intelligence, Machine Learning & Applied Analytics — particularly NLP, sentiment analysis, intelligent automation, and the application of AI to business and information systems.\n• Bioinformatics & Computational Research — large-scale biological data processing, parallel computing, statistical analysis, cloud-based research platforms, and computational approaches to scientific problems.", "projects": "I am interested in advising capstone projects that apply technology to solve practical business, operational, and social problems, particularly in financial services, digital platforms, enterprise systems, and data-driven applications. I am especially interested in projects that combine sound system design with clear business value, scalability, security, governance, and measurable outcomes. This aligns with my experience in digital banking, fintech, e-commerce, cloud platforms, enterprise architecture, software engineering, data systems, and technology leadership.\n\nExamples of projects I would be interested in advising include:\n\n• Digital banking, fintech, payments, lending, insurance, and financial inclusion solutions\n\n• Machine learning, NLP, analytics, and intelligent automation applications\n\n• Enterprise information systems, workflow automation, and business process digitization\n\n• Cloud-native, microservices, event-driven, and API-based platforms\n\n• Cybersecurity, identity and access management, technology risk, and regulatory compliance solutions\n\n• Data engineering, dashboards, decision-support systems, and data governance platforms\n\n• E-commerce, marketplaces, mobile applications, and digital service platforms\n\n• Technology-enabled solutions for operations, supply chain, logistics, and service delivery\n\n• Research-oriented projects involving bioinformatics, computational analysis, large-scale data processing, or applied statistical methods\n\nI would be particularly interested in projects that go beyond building a working application and demonstrate a strong understanding of the business problem, users, architecture, data, security, operational sustainability, and potential real-world impact.", "slots": 8}, {"name": "Reinald Adrian Pugoy", "sort": "pugoy", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEYARgDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QARxAAAQMCBAMFBgMFBgUDBQEAAQIDEQAEBRIhMQZBUQcTImFxFDKBkaGxI0LBFVLR4fAkM1NicpIIJUOC8Rai0jVEVHSDsv/EABsBAAIDAQEBAAAAAAAAAAAAAAABAgMEBQYH/8QAMBEAAgIBBAECBAUDBQAAAAAAAAECEQMEEiExQQVREyIysWGBkaHwM3HRBhQVUsH/2gAMAwEAAhEDEQA/AOj9pXaVe/tC4wfB31WzDB7t59swtxfNIPIDaRrM1zNS3XyXHFrXrKlrUVE/PelOLKlKdcUlx1xRWZMJBJ1nqaS6tb5AUopQAAAIE0yQpObLmAJjQqVv/KnBkbkSSdzNEYj3QANo/reghGUyBJ6UDFlSiNSIHQUknNqFajy3pBUZ1IGvOgHBm93yoAMiTuDI5UYSTImZ6UZUCOQ1ABpYKToqgBtAzKEmdedSAEoSsggAJ0n1pCUgE5Yk7eRpxDQdStJWEZE5oPOKYERKlJJSQE8taWCpRBG3KaQlPhUQCIIid6dCDIJUR0ka0CDywIGbroaUiIInb5UE5myc3zHMVU45xXhXDSM1/ckLIlLKdVq+H60hFnMGCRp0pRQQjQEgDfLXKsY7Wr67c7vB2WLVr/FeOdwnqBsPrWeusfu8UX3l5cvvPj8jjpAPokQKYHdENqdWlASRPM7CjRoiNI6VwRHF72HvGWUqO8oWpCk/Ktxwj2ji/u2rW7e7xDsIQtQ8STyn7fI+QKA36ipPiJ8tKEqgR4jtP6UlSyDlFJkpkETGokbUUMdkgCDP60Ik6AhR1BplSiASZ9KWlYIyk/8AigBxaxEK5E6UYygayTvpTfeJB60EajQieXlQA4F5jqST1iNKCVyIAKo2psidCTmJ1mlNqMGEjYiVHlFAC0oABIOQjURRISUyFqJ5Eg0EkKEiYPKdh60DlA0SDpNACylvdAJiT19aQ4kLgKTqNqShYGgRy1M09MtgpSE8tKAEoKwopKNBselKEEAiATyJ1nnTa5E59BOooi4QAEgR50APraUQFBQVBy7+VBtbrBS40442sGZSopUD5RTSblzJlUARmzAkE8qIuTEESZI0NAHVOzftBvLi9awbGHVPB7w29ws+MK/cUec8jvQrmmFXDrGJ2S21FKk3DZEf6xQpNCaK1So5yaESrorb1ogggyfXWl+o12j9KCQG1lJOY5uVGSUgAagedAag5U+KNB0oJbB1ifvTAAGaTJ1OgFECRIidaMZ pplication of artificial intelligence and Generative AI. Projects related to cybersecurity, information security, cybersecurity awareness, educational technology, data-driven systems, and technology applications are also within my areas of interest.", "slots": 5}];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(/\s+/).filter(w => /^[A-Z]/.test(w) && !/\.$/.test(w)).map(w => w[0]).slice(0, 2).join('');
const avatar = a => a.photo
  ? `<img class="avatar" src="${a.photo}" alt="Photo of ${esc(a.name)}">`
  : `<div class="avatar initials" aria-hidden="true">${initials(a.name)}</div>`;
const slotsBadge = a => `<span class="slots"><i></i>Up to ${a.slots} advisees</span>`;

// Turn free text into paragraphs and bullet lists
function prose(t) {
  return t.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    let html = '', list = [];
    const flush = () => { if (list.length) { html += '<ul>' + list.map(li => `<li>${esc(li)}</li>`).join('') + '</ul>'; list = []; } };
    for (const l of lines) {
      if (l.startsWith('•')) list.push(l.replace(/^•\s*/, ''));
      else { flush(); html += `<p>${esc(l)}</p>`; }
    }
    flush();
    return html;
  }).join('');
}
const firstLine = t => t.replace(/\n+/g, ' ').replace(/\s*•\s*/g, ' ').trim();

// Topics
const TOPICS = [...new Set(ADVISERS.flatMap(a => a.topics))].sort((x, y) => {
  const n = t => ADVISERS.filter(a => a.topics.includes(t)).length;
  return n(y) - n(x) || x.localeCompare(y);
});
let active = 'All';
const chips = document.getElementById('chips');
chips.innerHTML = ['All', ...TOPICS].map(t => `<button class="chip" type="button" aria-pressed="${t === active}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  active = b.dataset.t;
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.t === active));
  render();
});

const q = document.getElementById('q');
q.addEventListener('input', render);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function render() {
  const term = norm(q.value.trim());
  const list = ADVISERS.filter(a =>
    (active === 'All' || a.topics.includes(active)) &&
    (!term || norm([a.name, a.bio, a.interests, a.projects, a.topics.join(' ')].join(' ')).includes(term)));
  const grid = document.getElementById('grid');
  grid.innerHTML = list.length ? list.map(a => `
    <article class="card">
      <div class="top">${avatar(a)}<div><h2>${esc(a.name)}</h2>${slotsBadge(a)}</div></div>
      <div class="tags">${a.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <p class="blurb">${esc(firstLine(a.projects))}</p>
      <button type="button" data-i="${ADVISERS.indexOf(a)}">View full profile</button>
    </article>`).join('')
    : `<p class="empty">No advisers match that search. Try a broader keyword or pick “All”.</p>`;
  const slots = list.reduce((s, a) => s + a.slots, 0);
  document.getElementById('count').textContent =
    `Showing ${list.length} of ${ADVISERS.length} advisers · ${slots} advisee slots`;
}

const dlg = document.getElementById('dlg');
document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const a = ADVISERS[+b.dataset.i];
  document.getElementById('d-photo').innerHTML = avatar(a);
  document.getElementById('d-name').textContent = a.name;
  document.getElementById('d-slots').innerHTML = slotsBadge(a);
  document.getElementById('d-body').innerHTML = `
    <section><h3>Topics</h3><div class="tags">${a.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></section>
    <section><h3>About</h3>${prose(a.bio)}</section>
    <section><h3>Research and professional interests</h3>${prose(a.interests)}</section>
    <section><h3>Capstone projects they would like to advise</h3>${prose(a.projects)}</section>`;
  dlg.showModal();
  dlg.querySelector('.d-body').scrollTop = 0;
});
document.getElementById('d-close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

render();
</script>
